name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Pi and OpenClaw
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint, format, typecheck and test
        run: bun run check
      - name: Build the packages
        run: bun run build

  claude-code:
    name: Claude Code
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the plugin
        run: claude plugin validate plugins/claude-code

  codex:
    name: Codex
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Codex
        run: npm install --global @openai/codex
      - name: Install the packed plugin and check Codex offers its skill
        run: bun run check:codex

  hermes:
    name: Hermes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Lint, validate and test the plugin inside the Hermes image
        run: scripts/check-hermes.sh

  skills:
    name: Skills
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      ARTIL_NO_AUTOUPDATE: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install the artil CLI
        run: |
          curl -fsSL https://artil.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check the commands the skills run
        run: bun run check:skills

  # .github/rulesets/main-checks.json requires only this check, so list every job above in needs.
  checks:
    name: Checks
    needs: [typescript, claude-code, codex, hermes, skills]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Fail when a check did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
